<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RN Web Inspector</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --border: #262c36;
    --text: #e6e6e6; --dim: #8b949e;
    --get: #4caf50; --post: #58a6ff; --put: #f0a020; --delete: #ff5555; --patch: #b183ff;
    --err: #ff5555; --ok: #4caf50; --log: #8b949e; --warn: #f0a020; --info: #58a6ff;
    --try-bg: #0f1720; --try-border: #1f2733;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Menlo, monospace;
    font-size: 13px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  header h1 {
    font-size: 14px;
    margin: 0;
    font-weight: 600;
  }
  .status {
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 11px;
  }
  .status.connected {
    background: #133;
    color: var(--ok);
  }
  .status.disconnected {
    background: #311;
    color: var(--err);
  }
  .tabs {
    display: flex;
    gap: 4px;
    margin-left: 16px;
  }
  .tabs button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .tabs button.active {
    background: #1f2733;
    color: var(--text);
    border-color: #3a4454;
  }
  button#clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  #search-container {
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  #search-container input#filter {
    margin-left: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 6px;
    width: 220px;
  }
  #devicesBar {
    width: 100%;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 4px;
  }
  .device-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #0f1720;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px 4px 8px;
    font-size: 11px;
  }
  .device-pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ok);
    flex-shrink: 0;
  }
  .device-pill .appname {
    color: var(--text);
    font-weight: 600;
  }
  .device-pill .devicename {
    color: var(--dim);
  }
  .device-pill .platform {
    background: #1f2733;
    padding: 1px 6px;
    border-radius: 8px;
    color: var(--dim);
    font-size: 10px;
    text-transform: uppercase;
  }
  #noDevices {
    color: var(--dim);
    font-size: 11px;
  }
  main {
    flex: 1 0 auto;
    overflow: hidden;
    display: flex;
  }
  #list {
    flex: 1;
    overflow-y: auto;
    border-right: 1px solid var(--border);
  }
  #detail {
    flex: 0 0 42%;
    overflow-y: auto;
    padding: 14px;
  }
  .row {
    display: flex;
    gap: 8px;
    padding: 6px 14px;
    border-bottom: 1px solid #1a1f28;
    cursor: pointer;
    align-items: center;
  }
  .row:hover {
    background: #131820;
  }
  .row.selected {
    background: #1c2430;
  }
  .device-tag {
    width: 90px;
    flex-shrink: 0;
    color: var(--dim);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .method {
    font-weight: 700;
    width: 46px;
    flex-shrink: 0;
  }
  .method.GET { color: var(--get); }
  .method.POST { color: var(--post); }
  .method.PUT { color: var(--put); }
  .method.DELETE { color: var(--delete); }
  .method.PATCH { color: var(--patch); }
  .status-code {
    width: 34px;
    flex-shrink: 0;
  }
  .status-code.ok { color: var(--ok); }
  .status-code.err { color: var(--err); }
  .url {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .time {
    color: var(--dim);
    width: 60px;
    text-align: right;
    flex-shrink: 0;
    font-size: 12px;
  }
  .duration {
    color: var(--dim);
    width: 80px;
    text-align: right;
    flex-shrink: 0;
    font-size: 12px;
  }
  .level {
    width: 50px;
    flex-shrink: 0;
    font-weight: 700;
  }
  .level.log { color: var(--log); }
  .level.info { color: var(--info); }
  .level.warn { color: var(--warn); }
  .level.error { color: var(--err); }
  #detail {
    width: 42%;
    overflow-y: auto;
    padding: 14px;
  }
  #detail h3 {
    margin-top: 0;
    font-size: 12px;
    color: var(--dim);
    text-transform: uppercase;
  }
  pre {
    background: var(--try-bg);
    border: 1px solid var(--try-border);
    padding: 10px;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
    margin: 8px 0;
  }
  .copy-btn {
    position: absolute;
    top: 6px;
    right: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .copy-btn:hover {
    background: #1f2733;
    color: var(--text);
  }
  .empty {
    color: var(--dim);
    padding: 40px;
    text-align: center;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2733;
    color: var(--text);
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 1000;
    border: 1px solid var(--border);
  }
  .toast.show {
    opacity: 0.9;
  }
  .accordion {
    background: var(--panel);
    border-radius: 6px;
    margin: 8px 0;
    overflow: hidden;
  }
  .accordion-header {
    background: var(--try-bg);
    border: 1px solid var(--try-border);
    padding: 10px 14px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 13px;
  }
  .accordion-header:hover {
    background: #1a1f2b;
  }
  .accordion-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.2s ease-out;
    background: var(--try-bg);
    border: 1px solid var(--try-border);
    border-top: none;
  }
  .accordion-content.open {
    max-height: 500px;
    transition: max-height 0.2s ease-in;
    padding: 0 14px 14px;
  }
  .accordion-icon {
    width: 12px;
    height: 12px;
    transition: transform 0.2s;
    display: inline-block;
  }
  .accordion-icon.open {
    transform: rotate(180deg);
  }
</style>
</head>
<body>

<header>
  <h1>RN Web Inspector</h1>
  <span id="status" class="status disconnected">connecting…</span>
  <div class="tabs">
    <button data-tab="all" class="active">All</button>
    <button data-tab="network">Network</button>
    <button data-tab="log">Logs</button>
  </div>
  <button id="clear">Clear</button>
  <div id="devicesBar"><span id="noDevices">No devices connected yet</span></div>
</header>

<div id="search-container">
  <input id="filter" placeholder="Filter by url / message…" />
</div>

<main>
  <div id="list"><div class="empty">Waiting for events…</div></div>
  <div id="detail"><div class="empty">Select a row to see details</div></div>
</main>

<script>
const listEl = document.getElementById('list');
const detailEl = document.getElementById('detail');
const statusEl = document.getElementById('status');
const filterEl = document.getElementById('filter');
const devicesBarEl = document.getElementById('devicesBar');

let events = [];
let devices = new Map(); // deviceId -> { id, deviceName, appName, platform }
let activeTab = 'all';
let selectedId = null;
let idCounter = 0;

function showToast(message) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 200);
  }, 1500);
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onopen = () => {
    statusEl.textContent = 'connected';
    statusEl.className = 'status connected';
    ws.send(JSON.stringify({ type: 'hello', role: 'browser' }));
  };
  ws.onclose = () => {
    statusEl.textContent = 'disconnected — retrying…';
    statusEl.className = 'status disconnected';
    setTimeout(connect, 1500);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    switch (msg.type) {
      case 'history':
        events = msg.events.map(ev => ({ ...ev, _id: ev._id ?? idCounter++ }));
        render();
        break;

      case 'device-list':
        devices = new Map(msg.devices.map(d => [d.id, d]));
        renderDevices();
        break;

      case 'device-connected':
        devices.set(msg.device.id, msg.device);
        renderDevices();
        break;

      case 'device-disconnected':
        devices.delete(msg.deviceId);
        renderDevices();
        break;

      case 'network':
      case 'log':
        msg._id = idCounter++;
        events.push(msg);
        render();
        break;
    }
  };
}

function renderDevices() {
  if (devices.size === 0) {
    devicesBarEl.innerHTML = '<span id="noDevices">No devices connected yet</span>';
    return;
  }
  devicesBarEl.innerHTML = '';
  devices.forEach((d) => {
    const pill = document.createElement('div');
    pill.className = 'device-pill';
    pill.innerHTML = `
      <span class="dot"></span>
      <span class="appname">${escapeHtml(d.appName)}</span>
      <span class="devicename">on ${escapeHtml(d.deviceName)}</span>
      <span class="platform">${escapeHtml(d.platform)}</span>
    `;
    devicesBarEl.appendChild(pill);
  });
}

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    render();
  };
});
filterEl.oninput = render;
document.getElementById('clear').onclick = () => { events = []; selectedId = null; render(); };

function deviceLabel(deviceId) {
  const d = devices.get(deviceId);
  if (!d) return deviceId ? 'unknown' : '—';
  return d.deviceName;
}

function render() {
  const filterText = filterEl.value.toLowerCase();
  const filtered = events.filter(ev => {
    if (activeTab !== 'all' && ev.type !== activeTab) return false;
    if (!filterText) return true;
    const haystack = (ev.url || ev.message || '').toLowerCase();
    return haystack.includes(filterText);
  });

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty">No events yet</div>';
    return;
  }

  listEl.innerHTML = '';
  filtered.forEach((ev) => {
    const row = document.createElement('div');
    row.className = 'row' + (ev._id === selectedId ? ' selected' : '');
    const t = new Date(ev.timestamp || Date.now()).toLocaleTimeString();
    const device = deviceLabel(ev.deviceId);

    if (ev.type === 'network') {
      const statusClass = ev.status && ev.status >= 400 ? 'err' : 'ok';
      const durationMs = ev.duration ?? '?';
      row.innerHTML = `
        <span class="device-tag">${escapeHtml(device)}</span>
        <span class="method ${ev.method}">${ev.method}</span>
        <span class="status-code ${statusClass}">${ev.status ?? '…'}</span>
        <span class="url">${escapeHtml(ev.url)}</span>
        <span class="time">${t}</span>
        <span class="duration">${durationMs} ms</span>`;
    } else {
      row.innerHTML = `
        <span class="device-tag">${escapeHtml(device)}</span>
        <span class="level ${ev.level}">${ev.level}</span>
        <span class="url">${escapeHtml(ev.message)}</span>
        <span class="time">${t}</span>
        <span class="duration"></span>`;
    }
    row.onclick = () => { selectedId = ev._id; showDetail(ev); highlightSelected(); };
    listEl.appendChild(row);
  });
}

function highlightSelected() {
  [...listEl.children].forEach(r => r.classList.remove('selected'));
  render();
}

function showDetail(ev) {
  const d = devices.get(ev.deviceId);
  const deviceLine = d
    ? `${d.appName} — ${d.deviceName} (${d.platform})`
    : 'Unknown device (disconnected)';

  if (ev.type === 'network') {
    detailEl.innerHTML = `
      <h3>Device</h3>
      <pre>${escapeHtml(deviceLine)}</pre>
      <div class="accordion">
        <div class="accordion-header">
          <span>Request</span>
          <span class="accordion-icon">▾</span>
        </div>
        <div class="accordion-content">
          <pre>${ev.method} ${escapeHtml(ev.url)}\n\nHeaders:\n${fmt(ev.requestHeaders)}\n\nBody:\n${fmt(ev.requestBody)}</pre>
          <button class="copy-btn" onclick="copyToClipboard(this, 'Request')">Copy Request</button>
        </div>
      </div>
      <div class="accordion">
        <div class="accordion-header">
          <span>Response</span>
          <span class="accordion-icon">▾</span>
        </div>
        <div class="accordion-content">
          <pre>Status: ${ev.status}\nDuration: ${ev.duration ?? '?'} ms\n\nHeaders:\n${fmt(ev.responseHeaders)}\n\nBody:\n${fmt(ev.responseBody)}</pre>
          <button class="copy-btn" onclick="copyToClipboard(this, 'Response')">Copy Response</button>
        </div>
      </div>
    `;

    // Add event listeners for accordion functionality
    setTimeout(() => {
      const headers = detailEl.querySelectorAll('.accordion-header');
      headers.forEach(header => {
        header.addEventListener('click', () => {
          const content = header.nextElementSibling;
          const icon = header.querySelector('.accordion-icon');

          content.classList.toggle('open');
          icon.classList.toggle('open');
        });
      });
    }, 0);
  } else {
    detailEl.innerHTML = `
      <h3>Device</h3>
      <pre>${escapeHtml(deviceLine)}</pre>
      <div class="accordion">
        <div class="accordion-header">
          <span>${ev.level}</span>
          <span class="accordion-icon">▾</span>
        </div>
        <div class="accordion-content">
          <pre>${fmt(ev.args ?? ev.message)}</pre>
          <button class="copy-btn" onclick="copyToClipboard(this, 'Log')">Copy Log</button>
        </div>
      </div>
    `;

    // Add event listener for log accordion
    setTimeout(() => {
      const header = detailEl.querySelector('.accordion-header');
      if (header) {
        header.addEventListener('click', () => {
          const content = header.nextElementSibling;
          const icon = header.querySelector('.accordion-icon');

          content.classList.toggle('open');
          icon.classList.toggle('open');
        });
      }
    }, 0);
  }
}

function copyToClipboard(button, type) {
  const pre = button.previousElementSibling;
  if (!pre || pre.tagName !== 'PRE') return;
  const text = pre.textContent;
  navigator.clipboard.writeText(text).then(() => {
    showToast(`${type} copied to clipboard`);
  }).catch(err => {
    console.error('Failed to copy: ', err);
    showToast('Copy failed');
  });
}

function fmt(val) {
  if (val === undefined || val === null) return '(empty)';
  if (typeof val === 'string') return escapeHtml(val);
  try { return escapeHtml(JSON.stringify(val, null, 2)); } catch (e) { return String(val); }
}
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&')
    .replace(/</g, '<')
    .replace(/>/g, '>');
}

connect();
</script>
</body>
</html>
